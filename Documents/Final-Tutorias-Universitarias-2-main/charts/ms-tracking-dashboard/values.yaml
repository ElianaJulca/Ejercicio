# Default values for ms-tracking-dashboard.
# Configuraciones para el Dashboard de Trazabilidad (Frontend con WebSockets).

# -- Número de réplicas
replicaCount: 1

# -- Configuración de la imagen del contenedor
image:
  # REQUERIDO: Reemplazar con el repositorio de tu imagen Docker de tracking-dashboard
  repository: sebsgof11/tracking-dashboard # <--- USAR TU IMAGEN DOCKER CORRECTA
  pullPolicy: IfNotPresent
  tag: "latest" 

# --- Variables de Entorno (CRÍTICAS)
# Este dashboard necesita la URL de RabbitMQ para escuchar los eventos de trazabilidad.
environment:
  PORT: 9000 # Puerto interno del contenedor (Node.js/Express)
  
  # Conexión a RabbitMQ
  # NOTA: 'rabbitmq' es el nombre del servicio de RabbitMQ dentro del clúster.
  RABBITMQ_URL: amqp://rabbitmq:5672 
  
# --- Configuración del Servicio de Kubernetes
service:
  type: ClusterIP
  port: 9000 
  targetPort: 9000 # Puerto interno del contenedor

# --- Probes de Salud
livenessProbe:
  httpGet:
    path: / # El dashboard debe responder al path raíz
    port: 9000
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /
    port: 9000
  initialDelaySeconds: 2
  periodSeconds: 5

# --- Configuraciones por defecto (limpias)
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
ingress:
  enabled: false
httpRoute:
  enabled: false
resources: {}
autoscaling:
  enabled: false
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}