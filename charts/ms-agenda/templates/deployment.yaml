env:
          # 1. Variables del microservicio (PORT, LOG_LEVEL, RabbitMQ)
          {{- range $key, $value := .Values.environment }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
          # 2. Variables de conexión a la Base de Datos DEDICADA (db-agenda)
          - name: DB_HOST
            value: {{ .Values.db.host | quote }}
          - name: DB_PORT
            value: {{ .Values.db.port | quote }}
          - name: DB_USER
            value: {{ .Values.db.user | quote }}
          - name: DB_PASSWORD
            value: {{ .Values.db.password | quote }}
          - name: DB_NAME
            value: {{ .Values.db.name | quote }}